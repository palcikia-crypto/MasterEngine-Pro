<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasterEngine — AI Mastering Panel</title>
<style>
:root{--bg:#0b0e14;--card:#121722;--line:#1e2636;--txt:#dbe4f3;--dim:#7a879e;--acc:#6c9bff;--acc2:#31d0aa;--bad:#ff6b81}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 4px}h1 span{color:var(--acc)}
.sub{color:var(--dim);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:280px}
#drop{border:2px dashed #2a3853;color:var(--dim);border-radius:10px;padding:36px;text-align:center;cursor:pointer;transition:.2s}
#drop.on{border-color:var(--acc);color:var(--acc)}
button{background:var(--acc);color:#08111f;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px}
button.sec{background:#1c2740;color:var(--txt)}
button:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500}
.good{color:var(--acc2)}.warn{color:var(--bad)}
label.chk{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--dim);cursor:pointer}
#players{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
#players audio{width:100%}
.pl{flex:1;min-width:260px}
.pl h4{margin:0 0 6px;color:var(--dim);font-weight:500}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#1c2740;color:var(--acc);margin-left:6px}
canvas{width:100%;height:120px;display:block;background:#0d1220;border-radius:8px}
.stem{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.stem h3{margin:0 0 8px;font-size:15px;color:var(--acc2)}
.meters{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.meter .v{font-size:20px;font-weight:700}
.meter .l{color:var(--dim);font-size:12px}
#params label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;color:var(--dim)}
#params input[type=range]{flex:1}
a.dl{color:var(--acc);text-decoration:none;margin-right:12px}
#status{color:var(--dim);min-height:22px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎛 Master<span>Engine</span></h1>
<p class="sub">Автоматический ML-мастеринг · A/B в один тап · мастеринг каждого стема отдельно</p>

<div class="card">
  <div id="drop">Перетащи сюда трек (wav / mp3 / flac) или кликни для выбора<input type="file" id="file" hidden accept="audio/*"></div>
  <label class="chk"><input type="checkbox" id="stemsOn"> Разбить на стемы и смастерить каждую дорожку отдельно (вокал / барабаны / бас / остальное)</label>
  <div id="status"></div>
</div>

<div id="results" style="display:none">

<div class="row">
<div class="card">
  <h3 style="margin-top:0">Метрики</h3>
  <table id="metrics"><tr><th></th><th>До</th><th>После</th></tr></table>
  <div class="meters" id="meters"></div>
</div>
<div class="card" id="paramsCard">
  <h3 style="margin-top:0">Настройки цепочки <span class="tag">live</span></h3>
  <div id="params"></div>
  <button class="sec" id="rerun">↻ Пересчитать с этими настройками</button>
</div>
</div>

<div class="card" id="players">
  <div class="pl"><h4>Оригинал</h4><audio id="au0" controls preload="auto"></audio></div>
  <div class="pl"><h4>Мастер</h4><audio id="au1" controls preload="auto"></audio></div>
  <button class="sec" id="ab">A ⇄ B</button>
</div>

<div class="card" id="fxcards">
  <h3 style="margin-top:0">Спектр · оригинал vs мастер</h3>
  <canvas id="spec" width="1000" height="240"></canvas>
</div>

<div class="card" id="stemsCard" style="display:none">
  <h3 style="margin-top:0">Мастеринг по дорожкам</h3>
  <div id="stemsList"></div>
</div>

<div class="card">
  <h3 style="margin-top:0">Скачать</h3>
  <div id="dls"></div>
</div>

</div>
</div>

<script>
const $ = s => document.querySelector(s);
let job = null, file=null, lastRes=null, stemAB={};

const drop = $("#drop");
drop.onclick = () => $("#file").click();
drop.ondragover = e => {e.preventDefault();drop.classList.add("on")};
drop.ondragleave = () => drop.classList.remove("on");
drop.ondrop = e => {e.preventDefault();drop.classList.remove("on");file=e.dataTransfer.files[0];if(file)upload(file)};
$("#file").onchange = e => {file=e.target.files[0];if(file)upload(file)};

async function upload(f){
  const fd = new FormData(); fd.append("file", f); fd.append("use_stems", $("#stemsOn").checked);
  status("Анализирую трек…");
  const r = await fetch("/api/upload", {method:"POST", body:fd}); job = await r.json();
  if(job.error){status("Ошибка: "+job.error);return}
  status(`Загружено: ${f.name} · ${job.seconds}s · ${job.sr} Hz. Запускаю авто-мастеринг…`);
  master(null);
}

function status(s){$("#status").textContent=s}

async function master(params){
  $("#rerun").disabled = true; status(params?"Пересчитываю с твоими настройками…":"Мастерю: ML-подбор → рендер → уточнение…");
  const body = {params, stems: params? (lastRes&&$("#stemsOn").checked): $("#stemsOn").checked, refine_iters: 4};
  const r = await fetch("/api/master/"+job.id, {method:"POST", headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  lastRes = await r.json(); $("#rerun").disabled = false;
  if(lastRes.error){status("Ошибка: "+lastRes.error);return}
  status("Готово ✅ Жми A ⇄ B и слушай в наушниках.");
  show();
}

const M = [["lufs","LUFS (громкость)"],["peak_dbtp","True Peak, dBTP"],["centroid_hz","Спектр. центр, Hz"],["stereo_width_db","Стерео-ширина, dB"],["crest_db","Крест-фактор, dB"]];
function show(){
  $("#results").style.display="block";
  const mt=$("#metrics"); mt.innerHTML="<tr><th></th><th>До</th><th>После</th></tr>";
  for(const [k,l] of M){
    const a=job.before[k]??0, b=lastRes.after[k]??0;
    const f=v=> typeof v==='number' ? (Math.abs(v)>1000?v.toFixed(0):v.toFixed(2)) : v;
    mt.insertAdjacentHTML("beforeend", `<tr><td>${l}</td><td>${f(a)}</td><td class="${b>a?'good':'warn'}">${f(b)}</td></tr>`);
  }
  const ms=$("#meters");
  ms.innerHTML=`<div class="meter"><div class="v">${lastRes.after.lufs?.toFixed(1)}</div><div class="l">После · LUFS</div></div>
  <div class="meter"><div class="v">${lastRes.after.peak_dbtp?.toFixed(1)}</div><div class="l">После · dBTP</div></div>
  <div class="meter"><div class="v">${lastRes.loss.toFixed(2)}</div><div class="l">Loss сходимости</div></div>`;
  $("#au0").src = lastRes.files.original; $("#au1").src = lastRes.files.mastered;
  peaks("/api/peaks/"+job.id+"/original.wav", 0);
  peaks("/api/peaks/"+job.id+"/mastered.wav", 1);
  buildParams(lastRes.params);
  drawStems(); downloads(); spectrumSoon();
  $("#stemsCard").style.display = lastRes.stems? "block":"none";
}

function buildParams(p){
  const box=$("#params"); box.innerHTML="";
  addTon(box,"Цель громкости (LUFS)", p.target_lufs, -22,-8,0.5, v=>p.target_lufs=v);
  addTon(box,"Потолок (dBTP)", p.ceiling_dbtp, -2.5,-0.2,0.1, v=>p.ceiling_dbtp=v);
  addTon(box,"Стерео-ширина", p.stereo_width, 0.6,1.7,0.05, v=>p.stereo_width=v);
  addTon(box,"HPF, Hz", p.hpf_hz, 16,80,1, v=>p.hpf_hz=v);
  addTon(box,"Сатурация", p.saturation, 0,0.8,0.02, v=>p.saturation=v);
  addTon(box,"Эксайтер", p.exciter.mix, 0,0.35,0.01, v=>p.exciter.mix=v);
  addTon(box,"Де-эссер", p.de_ess.amount, 0,0.8,0.05, v=>p.de_ess.amount=v);
  const h=document.createElement("div");h.textContent="EQ по полосам (dB):";h.style.cssText="color:var(--dim);margin:10px 0 4px";box.appendChild(h);
  for(const k of Object.keys(p.band_gains_db).sort((a,b)=>parseFloat(a)-parseFloat(b)))
    addTon(box, k+" Hz", p.band_gains_db[k], -6,6,0.25, v=>p.band_gains_db[k]=v);
}
function addTon(box,label,val,min,max,step,set){
  const l=document.createElement("label");l.innerHTML=`<span>${label}</span>`;
  const i=document.createElement("input");i.type="range";i.min=min;i.max=max;i.step=step;i.value=val;
  const s=document.createElement("span");s.textContent=(+val).toFixed(2);s.style.minWidth="52px";s.style.textAlign="right";
  i.oninput=()=>{s.textContent=(+i.value).toFixed(2);set(+i.value)};
  l.append(i,s);box.appendChild(l);
}
$("#rerun").onclick=()=>master(lastRes.params);

async function peaks(url,idx){
  const r=await fetch(url); const d=await r.json();
  drawWave(d.peaks, idx);
}

function drawWave(pk, idx){
  const c=document.createElement("canvas");c.width=1000;c.height=48;c.style.height="48px";
  const g=c.getContext("2d");g.fillStyle="#0d1220";g.fillRect(0,0,1000,48);
  const col=idx?"#31d0aa":"#5b7dbb";g.fillStyle=col;
  pk.forEach((v,i)=>{const h=Math.min(1,v)*46;g.fillRect(i*(1000/pk.length),(48-h)/2,1000/pk.length,h)});
  ($("#wavebox")||(()=>{const w=document.createElement("div");w.id="wavebox";w.className="card";w.innerHTML="<h3 style='margin-top:0'>Волна</h3>";$("#spec").closest(".card").before(w);return w})()).appendChild(c);
}

let specTimer=null;
function spectrumSoon(){clearTimeout(specTimer);specTimer=setTimeout(spectrum,300)}
async function spectrum(){
  const c=$("#spec"),g=c.getContext("2d");
  const [o,m]=await Promise.all([fetch("/api/audio/j/"+job.id+"/original.wav"),fetch("/api/audio/j/"+job.id+"/mastered.wav")]);
  const ab0=await o.arrayBuffer(), ab1=await m.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC(44100);
  const [b0,b1]=await Promise.all([ctx.decodeAudioData(ab0),ctx.decodeAudioData(ab1)]);
  const n=128, dr=Math.floor(Math.min(b0.length,b1.length)/n);
  const spec=(buf)=>{const d=buf.getChannelData(0).slice(0,dr*n);
    const bands=new Array(n).fill(0);
    const w=new Float32Array(2048).map((_,i)=>0.54-0.46*Math.cos(2*Math.PI*i/2047));
    for(let k=0;k<Math.min(64,Math.floor(dr/(2048*3)));k++){
      const seg=d.slice(k*2048*3,k*2048*3+2048);
      const F=new Float32Array(4096).fill(0);F.set(seg);
      let re=new Float32Array(4096),im=new Float32Array(4096);
      for(let i=0;i<2048;i++){re[i]=F[i]*w[i];im[i]=0}
      fft(re,im);
      for(let i=1;i<1024;i++){
        const f=i*44100/4096; const band=Math.min(n-1,Math.floor(Math.log2(f/31)/Math.log(2)*n/10));
        bands[band]=Math.max(bands[band], Math.hypot(re[i],im[i]));
      }
    }
    return bands.map(v=>20*Math.log10((v||1)/Math.min(64,Math.floor(dr/(2048*3)))/32768)); };
  const A=spec(b0),B=spec(b1);
  g.fillStyle="#0d1220";g.fillRect(0,0,c.width,c.height);
  const W=c.width/n;
  for(let i=0;i<n;i++){
    const hA=(A[i]+90)/90*c.height, hB=(B[i]+90)/90*c.height;
    g.fillStyle="#38507a";g.fillRect(i*W,c.height-hA,W-1,hA);
    g.fillStyle="#31d0aa";g.fillRect(i*W,c.height-hB,W-1,hB);
  }
  ctx.close();
}
function fft(re,im){
  const n=re.length;for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let j2=0;j2<len/2;j2++){const ur=re[i+j2],ui=im[i+j2],vr=re[i+j2+len/2]*cr-im[i+j2+len/2]*ci,vi=re[i+j2+len/2]*ci+im[i+j2+len/2]*cr;
        re[i+j2]=ur+vr;im[i+j2]=ui+vi;re[i+j2+len/2]=ur-vr;im[i+j2+len/2]=ui-vi;
        const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr}}}
}

function drawStems(){
  const L=$("#stemsList"); if(!lastRes.stems){L.innerHTML="";return}
  L.innerHTML="";
  const names={"drums":"🥁 Барабаны","bass":"🎸 Бас","vocals":"🎤 Вокал","other":"🎹 Остальное"};
  for(const [k,v] of Object.entries(lastRes.stems)){
    const d=document.createElement("div");d.className="stem";
    d.innerHTML=`<h3>${names[k]||k}</h3>
    <div class="players" style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="pl"><h4>Сырой стем</h4><audio controls src="${v.files.original}"></audio></div>
      <div class="pl"><h4>Мастер</h4><audio controls src="${v.files.mastered}"></audio></div>
    </div>
    <small style="color:var(--dim)">LUFS ${v.before.lufs.toFixed(1)} → <b class="good">${v.after.lufs.toFixed(1)}</b> · TP ${v.before.peak_dbtp.toFixed(1)} → ${v.after.peak_dbtp.toFixed(1)} dBTP</small>`;
    L.appendChild(d);
  }
}

function downloads(){
  const d=$("#dls");d.innerHTML="";
  const items=[["Мастер","mastered.wav"],["Оригинал","original.wav"]];
  if(lastRes.files.stem_mix)items.unshift(["Стем-микс","stem_mix.wav"]);
  for(const [name,id] of items){
    const url=id==="mastered.wav"?lastRes.files.mastered:id==="original.wav"?lastRes.files.original:lastRes.files.stem_mix;
    d.insertAdjacentHTML("beforeend",`<a class="dl" href="${url}" download>⬇ ${name}</a>`);
  }
  for(const [k,v] of Object.entries(lastRes.stems||{}))
    d.insertAdjacentHTML("beforeend",`<a class="dl" href="${v.files.mastered}" download>⬇ ${k} (master)</a>`);
}

let isA=false;
$("#ab").onclick=()=>{
  const a=$("#au0"),b=$("#au1");
  if(!isA){a.currentTime=b.currentTime;b.play();a.pause()}else{b.currentTime=a.currentTime;a.play();b.pause()}
  isA=!isA;
};
</script>
</body>
</html>
